name: metatoolkit
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - python=3.10
  - pip
  - r-base=4.3
  - r-essentials
  - r-optparse
  - r-vegan
  - r-ggplot2
  - r-anthro
  - bioconductor-ancombc
  - bioconductor-phyloseq
  - pip:
      - metatoolkit @ git+https://github.com/theoportlock/metatoolkit.git@<commit-or-tag>
      # for the mofa/single-cell scripts use this line instead:
      # - metatoolkit[full] @ git+https://github.com/theoportlock/metatoolkit.git@<commit-or-tag>
