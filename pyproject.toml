[build-system]
requires = ["setuptools>=77.0"]   # `license = "MIT"` (SPDX string) needs setuptools>=77
build-backend = "setuptools.build_meta"

[project]
name = "metatoolkit"
version = "0.3.0"
authors = [
    { name = "Theo Portlock", email = "theo@portlocklab.com" }
]
description = "A set of scripts for biological data analysis"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "matplotlib",
    "matplotlib_venn",
    "networkx",
    "numpy",
    "pandas",
    "pycircos",
    "scipy",
    "seaborn",
    "shap",
    "scikit-bio",
    "scikit-learn",
    "sklearn_som",
    "lifelines",
    "statsmodels",
    "upsetplot",
    "sympy",
    "interpret",
    "typer",
    "workforce",
]

[project.optional-dependencies]
full = [
    "adjustText",
    "anndata",
    "igraph",
    "imbalanced-learn",
    "mofapy2",
    "mofax",
    "muon",
    "scanpy",
]

[project.scripts]
mtk = "metatoolkit.cli:main"

[project.urls]
Homepage = "https://github.com/theoportlock/metatoolkit"
Source = "https://github.com/theoportlock/metatoolkit"
"Bug Tracker" = "https://github.com/theoportlock/metatoolkit/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["metatoolkit*"]

[tool.setuptools.package-data]
metatoolkit = ["*"]
